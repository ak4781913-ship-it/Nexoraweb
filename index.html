    <script>
      (function () {
        try {
          var pref = localStorage.getItem('nexora_theme_preference');
          var isDark =
            pref === 'dark' ||
            ((pref === 'system' || !pref) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
