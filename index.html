      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('nexora_theme_preference');
          var isDark =
            pref === 'dark' ||
            ((pref === 'system' || !pref) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NEXORA",
        "description": "Independent digital products and technology innovation brand building practical software, AI tools, and online platforms.",
        "slogan": "One Vision. Multiple Innovations. Infinite Possibilities."
      }
    </script>
  </head>
